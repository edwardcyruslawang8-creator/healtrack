<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360">
  <!-- Soft background glow -->
  <circle cx="260" cy="190" r="170" fill="#ffffff" opacity="0.06"/>
  <circle cx="260" cy="190" r="130" fill="#ffffff" opacity="0.05"/>

  <!-- Ground line -->
  <rect x="40" y="300" width="440" height="4" rx="2" fill="#ffffff" opacity="0.15"/>

  <!-- Clinic building, simplified -->
  <g opacity="0.9">
    <rect x="330" y="150" width="140" height="150" fill="#ffffff" opacity="0.12"/>
    <rect x="330" y="150" width="140" height="14" fill="#ffffff" opacity="0.2"/>
    <rect x="350" y="180" width="24" height="24" fill="#ffffff" opacity="0.18"/>
    <rect x="390" y="180" width="24" height="24" fill="#ffffff" opacity="0.18"/>
    <rect x="430" y="180" width="24" height="24" fill="#ffffff" opacity="0.18"/>
    <rect x="350" y="220" width="24" height="24" fill="#ffffff" opacity="0.18"/>
    <rect x="430" y="220" width="24" height="24" fill="#ffffff" opacity="0.18"/>
    <rect x="388" y="250" width="28" height="50" fill="#ffffff" opacity="0.22"/>
    <g stroke="#ffffff" stroke-width="4" opacity="0.3">
      <line x1="402" y1="160" x2="402" y2="176"/>
      <line x1="394" y1="168" x2="410" y2="168"/>
    </g>
  </g>

  <!-- Doctor figure -->
  <g transform="translate(120,120)">
    <circle cx="40" cy="30" r="24" fill="#ffffff" opacity="0.95"/>
    <rect x="14" y="54" width="52" height="90" rx="20" fill="#ffffff" opacity="0.95"/>
    <rect x="30" y="60" width="20" height="70" rx="8" fill="#5B0A0A" opacity="0.6"/>
    <circle cx="40" cy="95" r="9" fill="#5B0A0A" opacity="0.55"/>
  </g>

  <!-- Parent figure -->
  <g transform="translate(210,140)">
    <circle cx="34" cy="26" r="20" fill="#ffffff" opacity="0.85"/>
    <rect x="12" y="46" width="44" height="80" rx="18" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Child figure -->
  <g transform="translate(268,168)">
    <circle cx="22" cy="18" r="14" fill="#ffffff" opacity="0.8"/>
    <rect x="8" y="32" width="28" height="54" rx="13" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Small cross / medical accent -->
  <g transform="translate(90,250)" opacity="0.5">
    <circle cx="0" cy="0" r="16" fill="#ffffff" opacity="0.15"/>
    <rect x="-2" y="-8" width="4" height="16" fill="#ffffff"/>
    <rect x="-8" y="-2" width="16" height="4" fill="#ffffff"/>
  </g>
</svg>
