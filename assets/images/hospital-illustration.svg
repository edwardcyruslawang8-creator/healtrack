<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe4f5"/>
      <stop offset="100%" stop-color="#eef6fb"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#sky)"/>
  <rect x="0" y="360" width="600" height="60" fill="#dfe6df"/>
  <!-- building base -->
  <rect x="150" y="120" width="320" height="240" fill="#f4f2ee"/>
  <rect x="150" y="120" width="320" height="14" fill="#8c1616"/>
  <rect x="150" y="346" width="320" height="14" fill="#8c1616"/>
  <!-- top sign band -->
  <rect x="150" y="70" width="320" height="50" fill="#ffffff" stroke="#e3e0da" stroke-width="1"/>
  <text x="310" y="92" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#5B0A0A" text-anchor="middle">NORTH SUPER</text>
  <text x="310" y="110" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600" fill="#5B0A0A" text-anchor="middle">HEALTH CENTER</text>
  <!-- shield logo -->
  <g transform="translate(295,40)">
    <path d="M15 0 L30 6 V18 C30 30 15 36 15 36 C15 36 0 30 0 18 V6 Z" fill="#5B0A0A"/>
    <path d="M8 17 h5 l2 -6 l4 12 l2 -6 h5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- windows grid -->
  <g fill="#bcd3e0">
    <rect x="175" y="150" width="34" height="34"/>
    <rect x="222" y="150" width="34" height="34"/>
    <rect x="269" y="150" width="34" height="34"/>
    <rect x="316" y="150" width="34" height="34"/>
    <rect x="363" y="150" width="34" height="34"/>
    <rect x="410" y="150" width="34" height="34"/>
    <rect x="175" y="200" width="34" height="34"/>
    <rect x="222" y="200" width="34" height="34"/>
    <rect x="269" y="200" width="34" height="34"/>
    <rect x="363" y="200" width="34" height="34"/>
    <rect x="410" y="200" width="34" height="34"/>
    <rect x="175" y="250" width="34" height="34"/>
    <rect x="222" y="250" width="34" height="34"/>
    <rect x="363" y="250" width="34" height="34"/>
    <rect x="410" y="250" width="34" height="34"/>
  </g>
  <!-- entrance -->
  <rect x="290" y="270" width="40" height="76" fill="#3a3a3a"/>
  <rect x="270" y="285" width="18" height="61" fill="#dfe9ee"/>
  <rect x="332" y="285" width="18" height="61" fill="#dfe9ee"/>
  <!-- steps -->
  <rect x="255" y="346" width="110" height="8" fill="#d9d5cd"/>
  <rect x="248" y="354" width="124" height="8" fill="#cfcbc2"/>
  <!-- red canopy over entrance -->
  <rect x="250" y="264" width="120" height="8" fill="#8c1616"/>
  <!-- side plants -->
  <ellipse cx="175" cy="358" rx="22" ry="10" fill="#6f8f5f"/>
  <ellipse cx="440" cy="358" rx="22" ry="10" fill="#6f8f5f"/>
</svg>
